project:
  name: Resiliencia de la capitalización individual
  slug: resiliencia-capitalizacion-individual
  description: >-
    Antecedentes empíricos sobre justicia previsional, institucionalismo
    discursivo, poder ideacional, coaliciones discursivas y legitimación
    tecnocrática en política social.
  bib_path: references.bib

paths:
  sources_dir: review-workspace/sources
  retrieval_intermediate_dir: review-workspace/retrieval/intermediate
  retrieval_curated_dir: review-workspace/retrieval/curated
  keyword_ledger: review-workspace/literature-keywords.yaml
  review_state_dir: review-workspace/review-state

retrieval:
  from_year: 1990
  to_year: null
  default_limit: 10
  user_agent: literature-review/0.1
  sources:
    enabled:
      - openalex
      - semantic-scholar
      - core
      - springer-metadata
      - springer-openaccess
      - crossref
    targeted:
      - arxiv
  core_terms:
    - discursive institutionalism
    - ideational power
    - discourse coalition
    - pension policy
    - social policy
  modifier_terms:
    - market justice
    - moral economy
    - policy change
    - policy persistence
    - ideational robustness
    - discourse network analysis
    - discourse structuration
    - legitimation
    - technocracy
    - expertise
    - welfare state
    - Latin America
    - Chile
  exclusion_terms: []
  default_queries:
    - pension reform discursive institutionalism empirical
    - social policy reform discursive institutionalism empirical case study
    - pension policy ideational power discourse
    - pension reform discourse coalition
    - welfare reform discourse coalition empirical
    - pension reform technocracy expert discourse legitimation
    - moral economy pension reform market justice
    - discourse structuration social policy change
  keyword_suggestion_limit: 30

apis:
  openalex:
    min_interval_seconds: 0.2
    retries: 4
    cache: true
  semantic_scholar:
    min_interval_seconds: 1.0
    retries: 4
    throttle_scope: project
    cache: true
  crossref:
    min_interval_seconds: 0.5
    retries: 4
    cache: true
  springer:
    metadata_api_key_env: SPRINGER_METADATA_API_KEY
    openaccess_api_key_env: SPRINGER_OPENACCESS_API_KEY
    min_interval_seconds: 1.0
    retries: 4
    cache: true
  core:
    api_key_env: CORE_API_KEY
    min_interval_seconds: 1.0
    retries: 4
    cache: true
