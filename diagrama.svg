<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">Resumen de la estrategia de análisis</title>
  <desc id="desc">Flujo desde el corpus y la codificación validada hasta el análisis de H1, Q2 y H3a a H3c, seguido por comprobación cualitativa.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px "DejaVu Sans", Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 19px "DejaVu Sans", Arial, sans-serif; fill: #526079; }
      .stage { font: 700 23px "DejaVu Sans", Arial, sans-serif; fill: #172033; }
      .body { font: 400 18px "DejaVu Sans", Arial, sans-serif; fill: #263348; }
      .small { font: 400 16px "DejaVu Sans", Arial, sans-serif; fill: #344258; }
      .tiny { font: 400 15px "DejaVu Sans", Arial, sans-serif; fill: #344258; }
      .tag { font: 700 17px "DejaVu Sans", Arial, sans-serif; fill: #172033; }
      .box { stroke-width: 2; filter: url(#shadow); }
      .arrow { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="900" fill="#ffffff"/>
  <text x="900" y="52" text-anchor="middle" class="title">Resumen de la estrategia de análisis</text>
  <text x="900" y="84" text-anchor="middle" class="subtitle">De los datos legislativos al contraste de la estructura, la legitimación y la robustez ideacional</text>

  <!-- 1. Corpus -->
  <rect x="35" y="165" width="225" height="270" rx="28" fill="#fbe3e3" stroke="#cf6666" class="box"/>
  <circle cx="78" cy="212" r="25" fill="#ffffff" stroke="#cf6666" stroke-width="2"/>
  <text x="78" y="219" text-anchor="middle" class="tag">1</text>
  <text x="147" y="215" text-anchor="middle" class="stage">Corpus</text>
  <text x="147" y="258" text-anchor="middle" class="body">
    <tspan x="147" dy="0">92 sesiones</tspan>
    <tspan x="147" dy="28">Sala y comisiones</tspan>
    <tspan x="147" dy="28">Cámara y Senado</tspan>
    <tspan x="147" dy="28">3 etapas deliberativas</tspan>
  </text>
  <rect x="63" y="365" width="169" height="43" rx="14" fill="#fff7f7" stroke="#dd8b8b"/>
  <text x="147" y="392" text-anchor="middle" class="tiny">Limpieza y segmentación</text>

  <!-- 2. Codificación -->
  <rect x="310" y="120" width="345" height="360" rx="28" fill="#fff1cf" stroke="#d69516" class="box"/>
  <circle cx="354" cy="168" r="25" fill="#ffffff" stroke="#d69516" stroke-width="2"/>
  <text x="354" y="175" text-anchor="middle" class="tag">2</text>
  <text x="505" y="171" text-anchor="middle" class="stage">Codificación asistida</text>

  <rect x="337" y="205" width="291" height="91" rx="16" fill="#fffaf0" stroke="#e0aa43" stroke-width="1.7"/>
  <text x="482" y="232" text-anchor="middle" class="tag">Declaraciones</text>
  <text x="482" y="260" text-anchor="middle" class="small">actor · concepto · posición · etapa</text>
  <text x="482" y="283" text-anchor="middle" class="small">→ relaciones de apoyo y rechazo</text>

  <rect x="337" y="306" width="291" height="91" rx="16" fill="#fffaf0" stroke="#e0aa43" stroke-width="1.7"/>
  <text x="482" y="333" text-anchor="middle" class="tag">Estrategias por declaración</text>
  <text x="482" y="360" text-anchor="middle" class="small">una principal · secundaria opcional</text>
  <text x="482" y="383" text-anchor="middle" class="tiny">evidencia + revisión de ambigüedad</text>

  <rect x="355" y="407" width="255" height="47" rx="15" fill="#ffffff" stroke="#d69516" stroke-width="2"/>
  <text x="482" y="437" text-anchor="middle" class="tag">LLM + validación manual</text>

  <!-- 3. Base analítica -->
  <rect x="705" y="183" width="190" height="235" rx="28" fill="#f4f6f8" stroke="#687386" class="box"/>
  <circle cx="749" cy="228" r="25" fill="#ffffff" stroke="#687386" stroke-width="2"/>
  <text x="749" y="235" text-anchor="middle" class="tag">3</text>
  <text x="814" y="230" text-anchor="middle" class="stage">Base</text>
  <ellipse cx="800" cy="286" rx="59" ry="20" fill="#ffffff" stroke="#536175" stroke-width="2.5"/>
  <path d="M741 286 V352 C741 363 767 372 800 372 C833 372 859 363 859 352 V286" fill="#ffffff" stroke="#536175" stroke-width="2.5"/>
  <ellipse cx="800" cy="352" rx="59" ry="20" fill="#ffffff" stroke="#536175" stroke-width="2.5"/>
  <text x="800" y="401" text-anchor="middle" class="small">Datos validados</text>

  <!-- 4. H1 -->
  <rect x="945" y="120" width="245" height="360" rx="28" fill="#e4f2df" stroke="#70a35d" class="box"/>
  <circle cx="989" cy="168" r="25" fill="#ffffff" stroke="#70a35d" stroke-width="2"/>
  <text x="989" y="175" text-anchor="middle" class="tag">4</text>
  <text x="1081" y="171" text-anchor="middle" class="stage">H1</text>
  <text x="1068" y="216" text-anchor="middle" class="tag">Estructura del debate</text>
  <text x="1068" y="255" text-anchor="middle" class="body">
    <tspan x="1068" dy="0">Congruencia y conflicto</tspan>
    <tspan x="1068" dy="28">entre actores</tspan>
  </text>
  <rect x="972" y="317" width="192" height="93" rx="16" fill="#f8fcf6" stroke="#8fba7e"/>
  <text x="1068" y="346" text-anchor="middle" class="small">Comunidades discursivas</text>
  <text x="1068" y="373" text-anchor="middle" class="small">+ intermediación de</text>
  <text x="1068" y="398" text-anchor="middle" class="small">la centroizquierda</text>

  <!-- 5. Q2 -->
  <rect x="1240" y="120" width="245" height="360" rx="28" fill="#e3eefc" stroke="#668fc4" class="box"/>
  <circle cx="1284" cy="168" r="25" fill="#ffffff" stroke="#668fc4" stroke-width="2"/>
  <text x="1284" y="175" text-anchor="middle" class="tag">5</text>
  <text x="1377" y="171" text-anchor="middle" class="stage">Q2</text>
  <text x="1362" y="216" text-anchor="middle" class="tag">Formas de legitimación</text>
  <text x="1362" y="255" text-anchor="middle" class="body">
    <tspan x="1362" dy="0">Estrategia principal según</tspan>
    <tspan x="1362" dy="28">partido, actor y etapa</tspan>
  </text>
  <rect x="1250" y="317" width="225" height="93" rx="16" fill="#f7faff" stroke="#8aacd5"/>
  <text x="1363" y="346" text-anchor="middle" class="small">Multinomial por declaración</text>
  <text x="1363" y="373" text-anchor="middle" class="small">actor + sesión (multinivel)</text>
  <text x="1363" y="398" text-anchor="middle" class="tiny">secundarias + ambigüedad</text>

  <!-- 6. H3 -->
  <rect x="1535" y="120" width="235" height="495" rx="28" fill="#eee7fa" stroke="#8a6db2" class="box"/>
  <circle cx="1579" cy="168" r="25" fill="#ffffff" stroke="#8a6db2" stroke-width="2"/>
  <text x="1579" y="175" text-anchor="middle" class="tag">6</text>
  <text x="1671" y="171" text-anchor="middle" class="stage">H3a–H3c</text>
  <text x="1652" y="211" text-anchor="middle" class="tag">Robustez ideacional</text>

  <rect x="1558" y="238" width="189" height="91" rx="15" fill="#fbf9fe" stroke="#aa92c8"/>
  <text x="1652" y="267" text-anchor="middle" class="tag">H3a · Permanencia</text>
  <text x="1652" y="294" text-anchor="middle" class="small">cobertura · balance</text>
  <text x="1652" y="316" text-anchor="middle" class="small">fuerza relacional</text>

  <rect x="1558" y="344" width="189" height="91" rx="15" fill="#fbf9fe" stroke="#aa92c8"/>
  <text x="1652" y="373" text-anchor="middle" class="tag">H3b · Difusión</text>
  <text x="1652" y="400" text-anchor="middle" class="tiny">base inicial fija + adopción</text>
  <text x="1652" y="422" text-anchor="middle" class="tiny">migración entre etapas</text>

  <rect x="1558" y="450" width="189" height="140" rx="15" fill="#fbf9fe" stroke="#aa92c8"/>
  <text x="1652" y="479" text-anchor="middle" class="tag">H3c · Adaptación</text>
  <text x="1652" y="506" text-anchor="middle" class="tiny">coocurrencia por intervención</text>
  <text x="1652" y="528" text-anchor="middle" class="tiny">solidaridad + restricciones</text>
  <text x="1652" y="550" text-anchor="middle" class="tiny">contributivas · focalizadas</text>
  <text x="1652" y="572" text-anchor="middle" class="tiny">o financieras</text>

  <!-- Main arrows -->
  <path d="M260 300 H300" class="arrow"/>
  <path d="M655 300 H695" class="arrow"/>
  <path d="M895 300 H935" class="arrow"/>
  <path d="M1190 300 H1230" class="arrow"/>
  <path d="M1485 300 H1525" class="arrow"/>

  <!-- Final qualitative check -->
  <path d="M1652 615 V668" class="arrow"/>
  <rect x="945" y="690" width="825" height="135" rx="26" fill="#f5f7fa" stroke="#697588" class="box"/>
  <circle cx="994" cy="737" r="25" fill="#ffffff" stroke="#697588" stroke-width="2"/>
  <text x="994" y="744" text-anchor="middle" class="tag">7</text>
  <text x="1358" y="738" text-anchor="middle" class="stage">Comprobación cualitativa e interpretación integrada</text>
  <text x="1358" y="779" text-anchor="middle" class="body">
    <tspan x="1358" dy="0">Lectura de las declaraciones que sostienen los patrones principales</tspan>
    <tspan x="1358" dy="29">para descartar polisemia, apropiación estratégica o proximidad textual</tspan>
  </text>

  <!-- Dependency note -->
  <path d="M1068 480 V644 H1260 V680" class="dash"/>
  <text x="1128" y="633" class="small">Las coaliciones detectadas informan Q2 y el seguimiento temporal</text>
</svg>
